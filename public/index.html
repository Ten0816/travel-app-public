<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#ffffff">

    <title>Travel App</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="app-header">
        <h1>Travel App</h1>
    </header>

    <main>

        <!-- =====================================================
         旅行一覧
         ===================================================== -->

        <section id="trip-list-view">

            <div class="section-header">
                <div>
                    <h2>旅行</h2>
                    <p class="section-description">
                        旅行の予定を管理します。
                    </p>
                </div>

                <button id="create-trip-button" class="primary-button">
                    ＋ 新しい旅行
                </button>
            </div>

            <div id="trip-list">
                読み込んでいます...
            </div>

        </section>


        <!-- =====================================================
         旅行詳細
         ===================================================== -->

        <section id="trip-detail-view" class="hidden">

            <button id="back-to-trip-list-button" class="text-button">
                ← 旅行一覧
            </button>

            <div class="section-header">
                <div>
                    <h2 id="trip-detail-name"></h2>
                    <p id="trip-detail-date" class="section-description"></p>
                </div>

                <div class="button-group">
                    <button id="edit-trip-button" class="secondary-button">
                        編集
                    </button>

                    <button id="delete-trip-button" class="danger-button">
                        削除
                    </button>
                </div>
            </div>

            <div class="trip-detail-card">

                <div class="detail-row">
                    <span class="detail-label">期間</span>
                    <span id="trip-detail-period"></span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">メモ</span>
                    <span id="trip-detail-description" class="pre-line"></span>
                </div>

            </div>

            <section class="trip-schedule-section">

                <div class="section-header">

                    <div>
                        <h3>予定</h3>

                        <p class="section-description">
                            旅行中の予定を管理します。
                        </p>
                    </div>

                    <button id="create-schedule-button" class="primary-button">
                        ＋ 予定を追加
                    </button>

                </div>


                <div id="schedule-list">
                    予定を読み込んでいます...
                </div>

            </section>


            <section class="trip-event-section">

                <div class="section-header">

                    <div>
                        <h3>候補イベント</h3>

                        <p class="section-description">
                            行きたい場所やイベントを登録します。
                        </p>
                    </div>

                    <button id="create-event-button" class="primary-button">
                        ＋ 候補を追加
                    </button>

                </div>


                <div id="event-list">
                    候補イベントを読み込んでいます...
                </div>

            </section>

        </section>

    </main>


    <!-- =========================================================
     旅行作成・編集モーダル
     ========================================================= -->

    <div id="trip-modal" class="modal hidden">
        <div class="modal-backdrop"></div>

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="trip-modal-title">
                    新しい旅行
                </h2>

                <button id="close-trip-modal-button" class="close-button" aria-label="閉じる">
                    ×
                </button>

            </div>

            <form id="trip-form">

                <div class="form-group">
                    <label for="trip-name">
                        旅行名
                    </label>

                    <input id="trip-name" name="name" type="text" maxlength="100" placeholder="例：東京旅行" required>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="trip-start-date">
                            開始日
                        </label>

                        <input id="trip-start-date" name="start_date" type="date">
                    </div>

                    <div class="form-group">
                        <label for="trip-end-date">
                            終了日
                        </label>

                        <input id="trip-end-date" name="end_date" type="date">
                    </div>

                </div>

                <div class="form-group">
                    <label for="trip-description">
                        メモ
                    </label>

                    <textarea id="trip-description" name="description" rows="5" maxlength="5000"
                        placeholder="旅行についてのメモ"></textarea>
                </div>

                <div class="modal-actions">

                    <button type="button" id="cancel-trip-button" class="secondary-button">
                        キャンセル
                    </button>

                    <button type="submit" class="primary-button">
                        保存
                    </button>

                </div>

            </form>

        </div>
    </div>

    <!-- =========================================================
     予定作成モーダル
     ========================================================= -->

    <div id="schedule-modal" class="modal hidden">

        <div class="modal-backdrop"></div>

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="schedule-modal-title">
                    予定を追加
                </h2>

                <button id="close-schedule-modal-button" class="close-button" type="button" aria-label="閉じる">
                    ×
                </button>

            </div>


            <form id="schedule-form">

                <div class="form-group">

                    <label for="schedule-title">
                        予定名
                    </label>

                    <input id="schedule-title" name="title" type="text" maxlength="200" placeholder="例：東京駅に到着" required>

                </div>


                <div class="form-group">

                    <label for="schedule-type">
                        種類
                    </label>

                    <select id="schedule-type" name="type">
                        <option value="other">
                            その他
                        </option>

                        <option value="move">
                            移動
                        </option>

                        <option value="event">
                            イベント
                        </option>

                        <option value="shop">
                            ショップ
                        </option>

                        <option value="sightseeing">
                            観光
                        </option>

                        <option value="food">
                            食事
                        </option>

                        <option value="hotel">
                            宿泊
                        </option>
                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="schedule-start-at">
                            開始日時
                        </label>

                        <input id="schedule-start-at" name="start_at" type="datetime-local">

                    </div>


                    <div class="form-group">

                        <label for="schedule-end-at">
                            終了日時
                        </label>

                        <input id="schedule-end-at" name="end_at" type="datetime-local">

                    </div>

                </div>


                <div class="form-group">

                    <label for="schedule-location">
                        場所
                    </label>

                    <input id="schedule-location" name="location_name" type="text" maxlength="200" placeholder="例：東京駅">

                </div>


                <div class="form-group">

                    <label for="schedule-address">
                        住所
                    </label>

                    <input id="schedule-address" name="address" type="text" maxlength="500"
                        placeholder="例：東京都千代田区丸の内1丁目">

                </div>


                <div class="form-group">

                    <label for="schedule-url">
                        公式サイト・詳細URL
                    </label>

                    <input id="schedule-url" name="external_url" type="url" maxlength="2000"
                        placeholder="https://example.com">

                </div>


                <div class="form-group">

                    <label for="schedule-description">
                        メモ
                    </label>

                    <textarea id="schedule-description" name="description" rows="4" maxlength="5000"
                        placeholder="予定についてのメモ"></textarea>

                </div>


                <div class="form-group">

                    <label for="schedule-priority">
                        優先度
                    </label>

                    <select id="schedule-priority" name="priority">

                        <option value="normal">
                            通常
                        </option>

                        <option value="high">
                            高い
                        </option>

                    </select>

                </div>


                <div class="modal-actions">

                    <button type="button" id="cancel-schedule-button" class="secondary-button">
                        キャンセル
                    </button>

                    <button type="submit" class="primary-button">
                        保存
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- =========================================================
 候補イベント作成・編集モーダル
 ========================================================= -->

    <div id="event-modal" class="modal hidden">

        <div class="modal-backdrop"></div>

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="event-modal-title">
                    候補イベントを追加
                </h2>

                <button id="close-event-modal-button" class="close-button" type="button" aria-label="閉じる">
                    ×
                </button>

            </div>


            <form id="event-form">

                <div class="form-group">

                    <label for="event-title">
                        イベント名
                    </label>

                    <input id="event-title" name="title" type="text" maxlength="200" placeholder="例：○○展" required>

                </div>


                <div class="form-group">

                    <label for="event-type">
                        種類
                    </label>

                    <select id="event-type" name="type">

                        <option value="other">
                            その他
                        </option>

                        <option value="event">
                            イベント
                        </option>

                        <option value="shop">
                            店舗
                        </option>

                        <option value="sightseeing">
                            観光
                        </option>

                        <option value="food">
                            食事
                        </option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="event-start-at">
                            開始日時
                        </label>

                        <input id="event-start-at" name="start_at" type="datetime-local">

                    </div>


                    <div class="form-group">

                        <label for="event-end-at">
                            終了日時
                        </label>

                        <input id="event-end-at" name="end_at" type="datetime-local">

                    </div>

                </div>


                <div class="form-group">

                    <label for="event-location">
                        場所
                    </label>

                    <input id="event-location" name="location_name" type="text" maxlength="200" placeholder="例：東京駅">

                </div>


                <div class="form-group">

                    <label for="event-address">
                        住所
                    </label>

                    <input id="event-address" name="address" type="text" maxlength="500" placeholder="例：東京都千代田区丸の内1丁目">

                </div>


                <div class="form-group">

                    <label for="event-url">
                        公式サイト・詳細URL
                    </label>

                    <input id="event-url" name="external_url" type="url" maxlength="2000"
                        placeholder="https://example.com">

                </div>


                <div class="form-group">

                    <label for="event-memo">
                        メモ
                    </label>

                    <textarea id="event-memo" name="memo" rows="4" maxlength="5000"
                        placeholder="イベントについてのメモ"></textarea>

                </div>


                <div class="form-group">

                    <label for="event-priority">
                        優先度
                    </label>

                    <select id="event-priority" name="priority">

                        <option value="normal">
                            通常
                        </option>

                        <option value="high">
                            高い
                        </option>

                    </select>

                </div>


                <div class="modal-actions">

                    <button type="button" id="cancel-event-button" class="secondary-button">
                        キャンセル
                    </button>

                    <button type="submit" class="primary-button">
                        保存
                    </button>

                </div>

            </form>

        </div>

    </div>

    <div id="common-modal" class="modal hidden">
        <div class="modal-backdrop"></div>

        <div class="modal-content common-modal-content" role="dialog" aria-modal="true"
            aria-labelledby="common-modal-title">
            <div class="modal-header">
                <h2 id="common-modal-title"></h2>

                <button id="common-modal-close-button" class="close-button" type="button" aria-label="閉じる">
                    ×
                </button>
            </div>

            <div id="common-modal-message" class="common-modal-message"></div>

            <div id="common-modal-actions" class="modal-actions"></div>
        </div>
    </div>


    <script type="module" src="./js/app.js"></script>

</body>

</html>
